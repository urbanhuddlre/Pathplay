<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#C9B6F0">
<title>The Urban Huddle Early Pass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ============ MENU SCREEN ============ -->
  <section id="menuScreen" class="screen active">
    <div class="menuCard">
      <img id="logoImg" class="logoImage" src="assets/logo.png" alt="Logo"
           onerror="this.style.display='none'; document.getElementById('titleFallback').style.display='block';">
      <h1 id="titleFallback" class="titleText" style="display:none;">logo.png</h1>
      <p class="subtitle">injak gasnya mpruy</p>

      <div id="songStatus" class="songStatus">Loading...…</div>

      <button id="startBtn" class="bigBtn" disabled>PLAY</button>
      <button id="viewLeaderboardBtn" class="ghostBtn">Leaderboard</button>
    </div>
  </section>

  <!-- ============ COUNTDOWN ============ -->
  <section id="countdownScreen" class="screen">
    <div id="countdownNum">3</div>
  </section>

  <!-- ============ GAME SCREEN ============ -->
  <section id="gameScreen" class="screen">
    <div class="hud">
      <button id="pauseBtn" class="hudPauseBtn" title="Pause">❚❚</button>
      <div class="hudCenter">
        <img id="hudLogoImg" class="hudLogo" src="assets/logo.png" alt="logo" onerror="this.style.display='none'">
      </div>
      <div class="hudRight">
        <span id="scoreVal" class="hudScoreVal">0</span>
        <span id="accVal" class="hudAccVal">100%</span>
      </div>
    </div>

    <div id="pauseOverlay" class="pauseOverlay">
      <div class="pauseOverlayCard">
        <h2 class="titleText">Pause</h2>
        <button id="resumeBtn" class="bigBtn">▶ PLAY</button>
      </div>
    </div>

    <div id="judgeText" class="judgeText"></div>

    <div id="lanesWrap" class="lanesWrap">
      <div class="lane" data-lane="left">
        <div class="laneTrack" id="track-left">
          <button class="laneBtn" data-lane="left">◀</button>
        </div>
      </div>
      <div class="lane" data-lane="down">
        <div class="laneTrack" id="track-down">
          <button class="laneBtn" data-lane="down">▼</button>
        </div>
      </div>
      <div class="lane" data-lane="up">
        <div class="laneTrack" id="track-up">
          <button class="laneBtn" data-lane="up">▲</button>
        </div>
      </div>
      <div class="lane" data-lane="right">
        <div class="laneTrack" id="track-right">
          <button class="laneBtn" data-lane="right">▶</button>
        </div>
      </div>
    </div>

    <div class="songProgressWrap">
      <div id="songProgressBar" class="songProgressBar"></div>
    </div>
  </section>

  <!-- ============ RESULT SCREEN ============ -->
  <section id="resultScreen" class="screen">
    <div class="menuCard">
      <h1 class="titleText small">Selesai!</h1>

      <div class="resultGrid">
        <div class="resultBox">
          <span class="resultLabel">Skor Akhir</span>
          <span id="finalScore" class="resultVal big">0</span>
        </div>
        <div class="resultBox">
          <span class="resultLabel">Akurasi</span>
          <span id="finalAcc" class="resultVal">100%</span>
        </div>
        <div class="resultBox">
          <span class="resultLabel">Max Combo</span>
          <span id="finalCombo" class="resultVal">0</span>
        </div>
        <div class="resultBox judgeCounts">
          <span class="resultLabel">Perfect / Good / Bad / Miss</span>
          <span id="finalJudges" class="resultVal small">0 / 0 / 0 / 0</span>
        </div>
      </div>

      <div id="saveScoreWrap" class="saveScoreWrap">
        <input id="playerName" class="nameInput" type="text" maxlength="16" placeholder="Your Name...">
        <button id="saveScoreBtn" class="bigBtn">Save</button>
      </div>
      <div id="saveStatus" class="saveStatus"></div>

      <button id="backToMenuBtn" class="ghostBtn">Menu</button>
    </div>
  </section>

  <!-- ============ LEADERBOARD SCREEN ============ -->
  <section id="leaderboardScreen" class="screen">
    <div class="menuCard">
      <h1 class="titleText small">Leaderboard</h1>
      <div id="leaderboardList" class="leaderboardList">
        <div class="lbLoading">Memuat…</div>
      </div>
      <button id="closeLeaderboardBtn" class="ghostBtn">Kembali</button>
    </div>
  </section>

</div>

<audio id="songAudio" preload="auto"></audio>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="leaderboard.js"></script>
<script src="beatdetect.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
